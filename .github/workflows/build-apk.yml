# Builds the AgriDose app on GitHub's servers every time you push,
# or when you press "Run workflow" on the Actions tab.
# The APK appears under the run's "Artifacts" as agridose-app-apk (a zip).
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu machines already have the Android SDK installed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: agridose-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
