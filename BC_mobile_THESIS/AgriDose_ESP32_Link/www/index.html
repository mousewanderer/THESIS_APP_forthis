<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26282D">
<title>AgriDose</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="ph-title">
      <h1>Solid Amendment <span class="nowrap">Project <span id="dot" class="dot" title="Machine offline"></span></span></h1>
      <button id="sun" class="ph-icon" type="button" aria-pressed="false" aria-label="Bright screen for sunlight">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button id="bell" class="ph-icon" type="button" aria-label="Alerts">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
        </svg>
        <span id="badge" class="badge" hidden></span>
      </button>
    </div>
    <div class="ph-row">
      <button id="who" class="ph-user" type="button">Choose a farmer</button>
      <button id="lang" class="chipbtn" type="button" aria-pressed="true">Bisaya</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden>Not connected to the AgriDose Wi-Fi. Reconnecting...</div>

  <main id="body" class="ph-body"></main>

  <nav id="tabs" class="tabs" aria-label="Pages">
    <button type="button" data-tab="machine">Machine</button>
    <button type="button" data-tab="records">Records</button>
    <button type="button" data-tab="recommend">Recommend</button>
    <button type="button" data-tab="crops">Crop Guide</button>
    <button type="button" data-tab="batches">Batch Log</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h3 id="sheet-title"></h3>
        <button id="sheet-close" class="sheet-close" type="button">Close</button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Photo">
    <img id="viewer-img" alt="">
    <div class="viewer-bar">
      <a id="viewer-full" class="vbtn" download>Save original</a>
      <a id="viewer-small" class="vbtn" download>Save compressed</a>
      <button id="viewer-close" class="vbtn main" type="button">Close</button>
    </div>
  </div>

  <div id="toast" class="ph-toast" hidden role="status"></div>
</div>
<script src="/agri.js"></script>
<script src="/app.js"></script>
</body>
</html>
