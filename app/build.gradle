plugins {
    id 'com.android.application'
}

android {
    namespace 'ph.agridose.dashboard'
    compileSdk 35

    defaultConfig {
        applicationId 'ph.agridose.dashboard'
        minSdk 24          // Android 7.0 and newer
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
